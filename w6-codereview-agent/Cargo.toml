[package]
name = "w6-codereview-agent"
version = "0.1.0"
edition = "2021"

[dependencies]
agent-core = { path = "../w6-simple-agent/crates/agent-core" }
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
async-trait = "0.1"
serde_json = "1"
colored = "2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
