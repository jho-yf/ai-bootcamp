[workspace]
resolver = "2"
members = ["src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["AI Bootcamp Team"]

[workspace.dependencies]
# Tauri 核心
tauri = { version = "2.1", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2.0"
tauri-plugin-shell = "2.0"

# 异步运行时
tokio = { version = "1.49", features = ["full"] }
tokio-tungstenite = "0.28"
futures-util = "0.3"

# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# 配置
toml = "0.8"
dirs = "5.0"

# 音频处理
cpal = "0.17"

# 输入模拟
enigo = "0.3"
arboard = "3.6"

# 编码
base64 = "0.22"

# 错误处理
thiserror = "2.0"
anyhow = "1.0"

# 日志
tracing = "0.1"
tracing-subscriber = "0.3"
