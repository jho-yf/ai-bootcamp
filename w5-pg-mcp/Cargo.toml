[package]
name = "pg-mcp"
version = "0.1.0"
edition = "2024"

[lib]
name = "pg_mcp"
path = "src/lib.rs"

[[bin]]
name = "pg-mcp"
path = "src/main.rs"

[dependencies]
rmcp = { version = "1.3", features = ["server", "transport-io", "macros", "schemars"] }
sqlparser = "0.61"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "uuid", "rust_decimal"] }
rust_decimal = "1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
reqwest = { version = "0.12", features = ["json"] }
toml = "0.8"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"

[dev-dependencies]
tokio-test = "0.4"
pretty_assertions = "1.4"
